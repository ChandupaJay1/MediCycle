<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevent zooming, support notch area display (viewport-fit=cover) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MediCycle</title>
    
    <!-- PWA Configurations -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#E8638A" />
    
    <!-- iOS Safari Meta Tags for PWA Installability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediCycle" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    
    <!-- Web App Icons and Favicons -->
    <link rel="icon" type="image/png" href="./icon-192.png" />
    
    <!-- Premium Google Fonts: Outfit for Headings, Inter for Body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Google Identity Services (GIS) & Google APIs (GAPI) client scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    
    <style>
      /* Ensure full viewport support on touch devices */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f7ecef; /* Soft rose outside container background */
        font-family: 'Inter', sans-serif;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
